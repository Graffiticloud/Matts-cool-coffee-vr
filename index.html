<style>
/* Layout: full-window WebGL diorama; frosted stats card top-left; control pill bar bottom-centre */
:root{
  --ground:#eeeae2;
  --ink:#14204a;
  --ink-soft:#4b5679;
  --royal:#2b4fd8;
  --teal:#17a3a0;
  --green:#3c9e4f;
  --orange:#ff6a13;
  --yellow:#f6c42a;
  --glass:rgba(255,255,255,.5);
  --glass-edge:rgba(255,255,255,.8);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--display)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--glass-edge);box-shadow:0 24px 60px -30px rgba(20,32,74,.35),inset 0 1px 0 rgba(255,255,255,.9)}
.card{position:fixed;top:max(16px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:min(500px,calc(100vw - 32px));box-sizing:border-box;padding:22px 24px 24px;border-radius:26px;display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.live{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 10px;border-radius:999px;background:rgba(255,106,19,.12);color:#c94a05;font:700 13px/1 var(--display);letter-spacing:.14em;text-transform:uppercase}
.live i{width:9px;height:9px;border-radius:50%;background:var(--orange);animation:pulse 2s ease-out infinite}
.live.paused{background:rgba(43,79,216,.12);color:var(--royal)}
.live.paused i{background:var(--royal);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,106,19,.55)}70%{box-shadow:0 0 0 9px rgba(255,106,19,0)}100%{box-shadow:0 0 0 0 rgba(255,106,19,0)}}
.clock{font:500 14px/1 var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
h1{margin:0;font:800 clamp(24px,4.2vw,34px)/1.04 var(--display);letter-spacing:-.025em;text-wrap:balance}

.stats{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
.stat{min-width:0;display:flex;flex-direction:column;gap:7px;padding:12px 12px 11px;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85)}
.label{font:700 11px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.value{font:600 clamp(18px,3.4vw,26px)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform-origin:left center}
.value.tick{animation:tick .45s ease-out}
@keyframes tick{0%{transform:scale(1)}35%{transform:scale(1.07);color:var(--royal)}100%{transform:scale(1)}}
.bar{height:5px;border-radius:5px}
.b1{background:var(--royal)}.b2{background:linear-gradient(90deg,var(--teal),var(--yellow))}.b3{background:var(--green)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100vw - 32px);display:flex;flex-direction:column;align-items:center;gap:10px}
.bar-ui{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:8px;border-radius:999px}
button{appearance:none;border:0;cursor:pointer;font:700 15px/1 var(--display);padding:12px 18px;border-radius:999px;background:rgba(255,255,255,.7);color:var(--ink);transition:transform .15s,background .15s}
button:hover{background:#fff}

button:focus-visible{outline:3px solid var(--royal);outline-offset:2px}
button.primary{background:var(--royal);color:#fff}

button.mr{background:var(--orange);color:#fff}
button.mr:hover{background:#e85d0c}
.hint{font:500 13px/1.4 var(--display);color:var(--ink-soft);text-align:center;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.55)}
@media (max-width:520px){button{padding:10px 14px;font-size:14px}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}.value.tick{animation:none}}

{
  const f = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.MeshStandardMaterial({ color:0xe6e1d7, roughness:0.95 }));
  f.rotation.x = -Math.PI / 2; floor.add(f);
  for(const r of [1.5, 3.5, 6.5, 10]){
    const ring = new THREE.Mesh(new THREE.RingGeometry(r - 0.012, r + 0.012, 96), new THREE.MeshBasicMaterial({ color:0xd2cbbd }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.002; floor.add(ring);
  }
}

/* ---------- helpers ---------- */
const mats = new Map(), geos = new Map();
function mat(color, opts = {}){
  const k = color + JSON.stringify(opts);
  if(!mats.has(k)) mats.set(k, new THREE.MeshStandardMaterial({ color, roughness:0.6, metalness:0, ...opts }));

}

}

  m.position.set(x, y, z); m.rotation.y = ry;
  m.castShadow = shadow; m.receiveShadow = true;
  if(parent) parent.add(m);

}

  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;

  return m;
}

  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), mat(color, opts));

/* build-in registry */
const builds = [];
const G = 0.16;
function addStatic(g, extra = 0){
  world.add(g);
  const d = Math.hypot(g.position.x, g.position.z);
  builds.push({ o:g, delay: 0.1 + d / 11.5 * 0.5 + rand() * 0.06 + extra, y:g.position.y, rise:true, base:g.scale.x });

}

  return g;
}
const spinners = [], steams = [], sways = [];

function ringPoint(h, c, s, out = {}){
  const L = 2 * (h - c), A = Math.PI * c / 2;
  let d = (((s % 1) + 1) % 1) * 4 * (L + A), k = 0;
  while(d > L + A && k < 3){ d -= L + A; k++; }

  if(d <= L){ x = h; z = -(h - c) + d; dx = 0; dz = 1; }
  else { const th = (d - L) / c; x = h - c + c * Math.cos(th); z = h - c + c * Math.sin(th); dx = -Math.sin(th); dz = Math.cos(th); }
  for(let i = 0; i < k; i++){ [x, z] = [-z, x]; [dx, dz] = [-dz, dx]; }
  out.x = x; out.z = z; out.dx = dx; out.dz = dz; out.P = 4 * (L + A);
  return out;
}
const yawOf = (dx, dz) => Math.atan2(-dz, dx);

/* ---------- slab, roads, pavements ---------- */
{
  const slab = new THREE.Group();
  box(17.2, 1.1, 17.2, C.slabSide, { r:0.5, y:-0.67, parent:slab });
  box(17.0, 0.3, 17.0, C.ground, { r:0.14, y:-0.14, parent:slab });
  box(12.8, 0.05, 12.8, C.road, { r:0.03, y:0.02, parent:slab });
  builds.push({ o:slab, delay:0, y:0, rise:true, base:1 }); world.add(slab); slab.scale.setScalar(0.0001);

  const block = new THREE.Group();
  box(8.8, 0.16, 8.8, C.walk, { r:0.08, y:0.08, parent:block });
  addStatic(block, -0.08);

  for(const [x, z, w, d] of [[0, 7.35, 16.8, 1.9],[0, -7.35, 16.8, 1.9],[7.35, 0, 1.9, 12.8],[-7.35, 0, 1.9, 12.8]]){
    const g = new THREE.Group(); g.position.set(x, 0, z);
    box(w, 0.16, d, C.walk, { r:0.08, y:0.08, parent:g });
    addStatic(g, -0.05);
  }

  const pt = ringPoint(5.42, 1.3, 0); const n = Math.round(pt.P / 0.9);
  const dashes = new THREE.InstancedMesh(rbGeo(0.36, 0.02, 0.08, 0.01), mat(C.line), n);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0,1,0);
  for(let i = 0; i < n; i++){
    ringPoint(5.42, 1.3, i / n, pt);
    q.setFromAxisAngle(up, yawOf(pt.dx, pt.dz));
    m4.compose(new THREE.Vector3(pt.x, 0.055, pt.z), q, new THREE.Vector3(1,1,1));
    dashes.setMatrixAt(i, m4);
  }

  const zebra = (x, z, alongX) => {
    const g = new THREE.Group(); g.position.set(x, 0, z);
    for(let i = 0; i < 6; i++){
      const o = -0.85 + i * 0.34;
      if(alongX) box(0.95, 0.02, 0.17, C.line, { r:0.01, y:0.055, z:o, parent:g, shadow:false });

}

/* ---------- buildings ---------- */
const winGeo = rbGeo(0.24, 0.32, 0.05, 0.03);
const winMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.25, metalness:0.05 });
function windowsFor(g, w, d, h, floorH, from = 0.62){
  const faces = [
    { len:w, place:(u, y) => [u, y, d / 2 + 0.012], ry:0 },
    { len:w, place:(u, y) => [u, y, -d / 2 - 0.012], ry:Math.PI },
    { len:d, place:(u, y) => [w / 2 + 0.012, y, -u], ry:Math.PI / 2 },
    { len:d, place:(u, y) => [-w / 2 - 0.012, y, u], ry:-Math.PI / 2 }
  ];
  const slots = [];
  for(const f of faces){
    const cols = Math.max(1, Math.floor((f.len - 0.3) / 0.42));
    const span = (cols - 1) * 0.42;
    for(let y = from; y < h - 0.3; y += floorH)
      for(let c = 0; c < cols; c++) slots.push({ p:f.place(-span / 2 + c * 0.42, y), ry:f.ry });
  }
  const im = new THREE.InstancedMesh(winGeo, winMat, slots.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0,1,0), col = new THREE.Color();
  slots.forEach((s, i) => {
    q.setFromAxisAngle(up, s.ry);
    m4.compose(new THREE.Vector3(...s.p), q, new THREE.Vector3(1,1,1));
    im.setMatrixAt(i, m4);
    const r = rand();
    col.set(r < 0.18 ? 0xffe3a0 : r < 0.3 ? 0xa9c2f2 : 0xe4eef6);
    im.setColorAt(i, col);

function building({ x, z, w, d, h, color, trim, floorH = 0.64, roof = [] }){
  const g = new THREE.Group(); g.position.set(x, G, z);

  box(w + 0.12, 0.16, d + 0.12, trim, { r:0.05, y:h + 0.02, parent:g });

  roofProps(g, w, d, h, roof);

}
building({ x:-2.45, z:-2.45, w:2.9, d:2.9, h:8.4, color:C.royal, trim:C.royalDeep, roof:[
  { t:'tank', x:-0.6, z:-0.5, c:C.yellow, c2:C.royalDeep }, { t:'antenna', x:0.8, z:0.7 }, { t:'ac', x:0.5, z:-0.6, k:4 } ] });

  { t:'ac', x:-0.9, z:0, k:3 }, { t:'ac', x:0.1, z:0, k:5 }, { t:'box', x:1.1, z:0, w:0.6, h:0.45, d:0.9, c:C.cream } ] });

let merged = false;
function mergeStatic(){
  model.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(world.matrixWorld).invert();
  const groups = new Map();
  world.traverse(o => {
    if(!o.isMesh || o.isInstancedMesh || o.material.transparent) return;
    for(let p = o; p && p !== world; p = p.parent) if(p.userData.anim) return;
    const key = o.material.uuid + (o.castShadow ? '|s' : '|n');
    if(!groups.has(key)) groups.set(key, { mat:o.material, cast:o.castShadow, list:[] });
    groups.get(key).list.push(o);
  });
  for(const g of groups.values()){
    if(g.list.length < 2) continue;
    const parts = g.list.map(o => {
      const geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
      for(const k of Object.keys(geo.attributes)) if(!['position','normal','uv'].includes(k)) geo.deleteAttribute(k);
      geo.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
      return geo;
    });
    const geo = mergeGeometries(parts, false);
    parts.forEach(p => p.dispose());
    if(!geo) continue;
    const m = new THREE.Mesh(geo, g.mat); m.castShadow = g.cast; m.receiveShadow = true;
    world.add(m);

}

function pollGamepads(dt){

  for(const c of [right, left]){
    if(!c) continue;
    const gp = c.userData.src.gamepad, hand = c.userData.src.handedness;
    const prev = prevButtons.get(hand) || [];
    const pressed = gp.buttons.map(b => b.pressed);
    const edge = i => pressed[i] && !prev[i];
    if(edge(4)) placeView(viewIdx + (hand === 'right' ? 1 : -1));
    if(edge(5)) setPlaying(!playing);
    prevButtons.set(hand, pressed);
    if(holders.size) continue;
    const sx = gp.axes[2] || 0, sy = gp.axes[3] || 0;
    if(hand === 'right' && Math.abs(sy) > 0.15){
      const k = Math.exp(-sy * dt * 1.6);
      const s = clamp(model.scale.x * k, 0.015, 6), kk = s / model.scale.x;
      const pivot = c.position;
      model.position.sub(pivot).multiplyScalar(kk).add(pivot);

      renderer.xr.getCamera().getWorldPosition(head); head.y = 0;
      model.position.sub(head).applyAxisAngle(new THREE.Vector3(0, 1, 0), ang).add(head);
      model.rotation.y += ang;
    }
  }
  if(stretch){
    const d = stretch.a.position.distanceTo(stretch.b.position);
    const s = clamp(stretch.s0 * d / stretch.d0, 0.015, 6);
    const mid = stretch.a.position.clone().add(stretch.b.position).multiplyScalar(0.5);
    model.position.copy(stretch.p0).sub(stretch.m0).multiplyScalar(s / stretch.s0).add(mid);
    model.scale.setScalar(s); syncShadow();
  }
}

/* ---------- animation ---------- */
const tmp = {};
let simT = 0, lastNow = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = clamp((now - lastNow) / 1000, 0, 0.1); lastNow = Math.max(lastNow, now);
  if(playing) simT += dt;
  const t = simT, lt = t % LOOP, ph = TAU * lt / LOOP;

  /* build-in */
  let allDone = true;
  for(const b of builds){
    if(b.done) continue;
    allDone = false;
    const p = clamp((t - b.delay) / 0.5, 0, 1);
    const s = Math.max(0.0001, easeOutBack(p)) * b.base;
    b.o.scale.setScalar(s);
    if(b.dyn) b.o.userData.pop = s;
    if(b.rise) b.o.position.y = b.y - (1 - easeOutCubic(p)) * 1.8;
    if(p >= 1){ b.o.scale.setScalar(b.base); if(b.dyn) b.o.userData.pop = 1; if(b.rise) b.o.position.y = b.y; b.done = true; }
  }
  if(allDone && !merged) mergeStatic();

  /* desktop camera */
  if(!renderer.xr.isPresenting){
    if(autoCam){
      const az = Math.PI / 4 + (reduced ? 0 : 0.3) * Math.sin(ph);
      const push = reduced ? 0 : 0.5 - 0.5 * Math.cos(ph);
      const R = fitDistance() * (1 - 0.08 * push), el = 0.57;
      camera.position.set(target.x + R * Math.cos(el) * Math.sin(az), target.y + R * Math.sin(el), target.z + R * Math.cos(el) * Math.cos(az));
      camera.lookAt(target);
    } else controls.update();
    world.position.y = 0.12 * Math.sin(ph);
  } else {
    world.position.y = 0;
    pollGamepads(dt);
  }

  /* cars */
  for(const c of cars){
    const s = (lt / LOOP + c.off) % 1;
    if(c.lane === 'outer'){ ringPoint(5.88, 1.6, 1 - s, tmp); tmp.dx = -tmp.dx; tmp.dz = -tmp.dz; }
    else ringPoint(4.98, 1.1, s, tmp);
    c.g.position.x = tmp.x; c.g.position.z = tmp.z;
    c.g.rotation.y = yawOf(tmp.dx, tmp.dz);
    c.b.position.y = 0.012 * Math.sin(lt * 22 + c.off * 10);
    const spin = -(lt / LOOP) * tmp.P / 0.12;
    for(const w of c.wheels) w.rotation.z = spin;
  }

  /* scooters */
  for(const sc of scooters){
    const h = 4.72, cr = 0.8;
    ringPoint(h, cr, 0, tmp); const P = tmp.P;
    const s0 = (sc.park.z + (h - cr)) / P;
    const p = smooth(sc.start, sc.start + sc.dur, lt);
    ringPoint(h, cr, s0 + p, tmp);
    const w = smooth(0, 0.07, p) * (1 - smooth(0.93, 1, p));
    sc.g.position.x = sc.park.x + (tmp.x - sc.park.x) * w;
    sc.g.position.z = sc.park.z + (tmp.z - sc.park.z) * w;
    sc.g.position.y = 0.05 + (1 - w) * (G - 0.05);
    sc.g.rotation.y = lerpAngle(0, yawOf(tmp.dx, tmp.dz), smooth(0, 1, w));
    sc.b.rotation.x = (p > 0 && p < 1 ? 1 : 0) * 0.04 * Math.sin(lt * 9);
    for(const wh of sc.wheels) wh.rotation.z = -p * P / 0.1;

  const base = Math.floor(lt / 2), f = (lt % 2) / 2;
  const moveP = smooth(0, 0.5, f);
  for(const q of queue){
    const slot = ((q.i - base) % 5 + 5) % 5;
    let x, z, sc = 1;
    if(slot === 0){
      if(f < 0.3){
        const e = smooth(0, 0.3, f);
        x = QUEUE[0].x + (DOOR.x - QUEUE[0].x) * e; z = QUEUE[0].z + (DOOR.z - QUEUE[0].z) * e;
        sc = 1 - smooth(0.18, 0.3, f);
      } else {

    } else {

  for(const w of walkers){
    const u = Math.sin(ph + w.ph) * w.amp, v = Math.cos(ph + w.ph);
    if(w.side === 'z'){ w.p.position.set(u, G, w.off); if(playing) w.yaw = lerpAngle(w.yaw, v >= 0 ? 0 : Math.PI, 0.12); }
    else { w.p.position.set(w.off, G, u); if(playing) w.yaw = lerpAngle(w.yaw, v >= 0 ? -Math.PI / 2 : Math.PI / 2, 0.12); }
    w.p.rotation.y = w.yaw;
    walkPose(w.p, lt + w.ph, clamp(Math.abs(v) * 1.6, 0, 1));
    w.p.scale.setScalar(0.9 * (w.p.userData.pop ?? 1));
  }

  for(const s of seated){
    s.p.userData.head.rotation.z = 0.12 * Math.sin(ph * 2 + s.ph);
    s.p.userData.armR.rotation.z = -0.9 - 0.5 * Math.max(0, Math.sin(ph * 5 + s.ph));
  }
  for(const sp of spinners) sp.o.rotation.y = ph * sp.k * 4;
  for(const s of sways) s.o.rotation.z = 0.05 * Math.sin(ph * 2 + s.ph);
  bladeSign.rotation.z = 0.08 * Math.sin(ph * 3);
  cradle.position.y = 1.2 + 2.6 * (0.5 - 0.5 * Math.cos(ph));
  for(const s of steams){
    const p = ((lt / s.period) + s.i / s.count) % 1;
    s.m.position.set(s.x + Math.sin(p * 6 + s.i) * 0.06 * s.size, s.y + p * s.rise, s.z);
    s.m.scale.setScalar(0.6 + p * 1.6);
    s.m.material.opacity = Math.sin(p * Math.PI) * 0.75;
  }

  updateStats(t, playing ? dt : 0);

  if(renderer.xr.isPresenting){
    if(panelDirty) drawPanel();
    renderer.render(scene, camera);
  } else {
    composer.render();
  }
});
</script>
